name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qtsbilling
          POSTGRES_PASSWORD: qtsbilling
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qtsbilling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QTS_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=qts_migrator;Password=qtsbilling;Database=postgres
      QTS_TEST_POSTGRES_RUNTIME_CONNECTION: Host=localhost;Port=5432;Username=qts_app;Password=qtsbilling;Database=postgres
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for secrets and double-encoded UTF-8
        run: pwsh -File scripts/secret-scan.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Provision migration and runtime roles
        run: >
          pwsh -File scripts/provision-postgres-roles.ps1 -Mode Psql -Action Provision
          -HostName postgres -Port 5432 -Database postgres -AdminUser qtsbilling
          -AdminPassword qtsbilling -MigratorUser qts_migrator -MigratorPassword qtsbilling
          -AppUser qts_app -AppPassword qtsbilling

      - name: Build and publish web host + WASM client
        run: dotnet publish QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release -o out/wasm-verify

      - name: Inspect WASM bundle for server assemblies
        run: pwsh -File scripts/verify-wasm-bundle.ps1 -PublishRoot out/wasm-verify

      - name: Apply migrations using the DDL owner
        run: |
          dotnet tool restore
          dotnet ef database update --project QtsBilling.Persistence.Postgres --context BillingDbContext
        env:
          QTS_POSTGRES_CONNECTION: ${{ env.QTS_TEST_POSTGRES_CONNECTION }}

      - name: Verify runtime role has DML privileges only
        run: >
          pwsh -File scripts/provision-postgres-roles.ps1 -Mode Psql -Action Verify
          -HostName postgres -Port 5432 -Database postgres -AppUser qts_app -AppPassword qtsbilling

      - name: Test PostgreSQL/API integration suite
        run: dotnet test TestQtsBilling/TestQtsBilling.csproj -c Release
        env:
          ConnectionStrings__BillingDb: Host=localhost;Port=5432;Username=qts_app;Password=qtsbilling;Database=postgres

      - name: Test SQLite device store
        run: dotnet test QtsBilling.Persistence.Sqlite.Tests/QtsBilling.Persistence.Sqlite.Tests.csproj -c Release

  release:
    name: Build & publish versioned assets
    runs-on: windows-latest
    needs: [verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Tag must be of the form vMAJOR.MINOR.PATCH (got: $ref)"; exit 1
          }
          $v = $ref.Substring(1)
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV    -Encoding ascii -Append
          "TAG=$ref"   | Out-File -FilePath $env:GITHUB_ENV    -Encoding ascii -Append
          Write-Host "Release version $v (tag $ref)"

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish web host + WASM client (win-x64)
        shell: pwsh
        run: >
          dotnet publish QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release -r win-x64 --self-contained true
          -p:Version="$env:VERSION" -p:InformationalVersion="$env:VERSION"
          -p:IncludeNativeLibrariesForSelfExtract=true -o out/server-win-x64

      - name: Publish web host + WASM client (linux-x64)
        shell: pwsh
        run: >
          dotnet publish QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release -r linux-x64 --self-contained true
          -p:Version="$env:VERSION" -p:InformationalVersion="$env:VERSION"
          -o out/server-linux-x64

      - name: Publish desktop app (MAUI, win-x64, unpackaged)
        shell: pwsh
        run: >
          dotnet publish QtsBilling.Maui/QtsBilling.Maui.csproj -c Release
          -f net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64
          -p:WindowsPackageType=None -p:ApplicationDisplayVersion="$env:VERSION" -p:Version="$env:VERSION"
          -o out/desktop-win-x64

      - name: Package release assets
        shell: pwsh
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path out/server-win-x64/*   -DestinationPath "artifacts/QtsBilling.Server-win-x64-$v.zip" -Force
          Compress-Archive -Path out/server-linux-x64/*  -DestinationPath "artifacts/QtsBilling.Server-linux-x64-$v.zip" -Force
          Compress-Archive -Path out/desktop-win-x64/*   -DestinationPath "artifacts/QtsBilling.Desktop-win-x64-$v.zip" -Force
          Get-ChildItem artifacts/*.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path artifacts/SHA256SUMS.txt -Encoding ascii
          Get-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub Release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = (Get-ChildItem artifacts).FullName
          gh release create "$env:TAG" --title "QtsBilling $env:VERSION" --generate-notes -- $assets
