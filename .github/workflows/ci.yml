name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & test (server · web · libraries)
    runs-on: ubuntu-latest

    # The financial tests run against a real PostgreSQL 18, never against a mock and never against a
    # production target. The fixture creates its own random qts_test… database and drops it afterwards.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qtsbilling
          POSTGRES_PASSWORD: qtsbilling
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qtsbilling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      QTS_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=qts_migrator;Password=qtsbilling;Database=postgres
      QTS_TEST_POSTGRES_RUNTIME_CONNECTION: Host=localhost;Port=5432;Username=qts_app;Password=qtsbilling;Database=postgres

    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for secrets and double-encoded UTF-8
        run: pwsh -File scripts/secret-scan.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Provision migration and runtime roles
        run: >
          pwsh -File scripts/provision-postgres-roles.ps1 -Mode Psql -Action Provision
          -HostName postgres -Port 5432 -Database postgres -AdminUser qtsbilling
          -AdminPassword qtsbilling -MigratorUser qts_migrator -MigratorPassword qtsbilling
          -AppUser qts_app -AppPassword qtsbilling

      - name: Build web host + WASM client + libraries (MAUI excluded on Linux)
        run: dotnet build QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release

      - name: Publish and inspect the WASM bundle
        run: |
          dotnet publish QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release --no-restore -o out/wasm-verify
          pwsh -File scripts/verify-wasm-bundle.ps1 -PublishRoot out/wasm-verify

      - name: Apply migrations using the DDL owner
        run: |
          dotnet tool restore
          dotnet ef database update --project QtsBilling.Persistence.Postgres --context BillingDbContext
        env:
          QTS_POSTGRES_CONNECTION: ${{ env.QTS_TEST_POSTGRES_CONNECTION }}

      - name: Verify runtime role has DML privileges only
        run: >
          pwsh -File scripts/provision-postgres-roles.ps1 -Mode Psql -Action Verify
          -HostName postgres -Port 5432 -Database postgres -AppUser qts_app -AppPassword qtsbilling

      - name: Test domain, contracts and the PostgreSQL/API integration suite
        run: dotnet test TestQtsBilling/TestQtsBilling.csproj -c Release
        env:
          ConnectionStrings__BillingDb: Host=localhost;Port=5432;Username=qts_app;Password=qtsbilling;Database=postgres

      - name: Test device store (SQLite, no external services)
        run: dotnet test QtsBilling.Persistence.Sqlite.Tests/QtsBilling.Persistence.Sqlite.Tests.csproj -c Release

      - name: Test migration tooling
        run: dotnet test QtsBilling.Migration.Tests/QtsBilling.Migration.Tests.csproj -c Release

      # Task 21: the production admission is fail-closed and environment-bound. The harness replaces
      # every external command with a controlled double; it never runs against a real target. A
      # missing PowerShell 7 fails the test instead of skipping it.
      - name: Prove fail-closed production admission
        run: >-
          dotnet test TestQtsBilling/TestQtsBilling.csproj -c Release --no-build
          --filter "FullyQualifiedName~ProductionAdmissionTests"

  build-desktop:
    name: Build desktop (MAUI · Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build desktop app
        run: dotnet build QtsBilling.Maui/QtsBilling.Maui.csproj -c Release
