name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & test (server · web · libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build web host + WASM client + libraries (MAUI excluded on Linux)
        run: dotnet build QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release

      - name: Test domain + contracts (no external services)
        run: dotnet test TestQtsBilling/TestQtsBilling.csproj -c Release

      - name: Test device store (SQLite, no external services)
        run: dotnet test QtsBilling.Persistence.Sqlite.Tests/QtsBilling.Persistence.Sqlite.Tests.csproj -c Release

  build-desktop:
    name: Build desktop (MAUI · Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build desktop app
        run: dotnet build QtsBilling.Maui/QtsBilling.Maui.csproj -c Release
