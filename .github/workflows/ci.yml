name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & test (server · web · libraries)
    runs-on: ubuntu-latest

    # The financial tests run against a real PostgreSQL 18, never against a mock and never against a
    # production target. The fixture creates its own random qts_test… database and drops it afterwards.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qtsbilling
          POSTGRES_PASSWORD: qtsbilling
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qtsbilling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      QTS_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=qtsbilling;Password=qtsbilling;Database=postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build web host + WASM client + libraries (MAUI excluded on Linux)
        run: dotnet build QtsWebApp/QtsWebApp/QtsWebApp.csproj -c Release

      - name: Test domain, contracts and the PostgreSQL/API integration suite
        run: dotnet test TestQtsBilling/TestQtsBilling.csproj -c Release

      - name: Test device store (SQLite, no external services)
        run: dotnet test QtsBilling.Persistence.Sqlite.Tests/QtsBilling.Persistence.Sqlite.Tests.csproj -c Release

      # The cutover safety is part of the release controls, so it runs on every build: the read-only
      # admission must write nothing, and a failed gate must stop the execution before the import.
      - name: Install the PostgreSQL client (the cutover script)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore the EF tool and apply the migrations to the test database
        run: |
          dotnet tool restore
          dotnet ef database update --project QtsBilling.Persistence.Postgres --context BillingDbContext
        env:
          QTS_POSTGRES_CONNECTION: ${{ env.QTS_TEST_POSTGRES_CONNECTION }}

      - name: Prove the cutover safety
        run: pwsh -File scripts/qb39-cutover-safety.ps1
        env:
          QTS_POSTGRES_CONNECTION: ${{ env.QTS_TEST_POSTGRES_CONNECTION }}
          QTS_CUTOVER_SQL_MODE: Psql
          QTS_CUTOVER_CODEWORD: ci-rehearsal-codeword
          QTS_CUTOVER_PRESENTED_CODEWORD: ci-rehearsal-codeword
          QTS_OWNER_PASSWORD: ci-rehearsal-password
          QTS_RECONCILIATION_KEY: ci-rehearsal-signing-key

  build-desktop:
    name: Build desktop (MAUI · Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build desktop app
        run: dotnet build QtsBilling.Maui/QtsBilling.Maui.csproj -c Release
