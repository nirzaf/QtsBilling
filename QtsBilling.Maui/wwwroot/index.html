<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- Zoom stays available: an operator must be able to read a form and its money at 200% and 400%. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QTS Billing</title>
    <base href="/" />
    <!-- Host-owned assets: MudBlazor and the shared component stylesheet live with the host, not inside
         the shared library, so the same components can be hosted by the web application. -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/QtsBilling.Ui/QtsBilling.Ui.bundle.scp.css" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app">Loading QTS Billing...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">Dismiss</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <!-- Local-only document output for this device (specification task 24): the authenticated client has already
         fetched the snapshot, so printing never navigates a WebView at a bearer route and never writes a file. -->
    <script src="document-output.js"></script>
    <!-- Local file output for a report export (specification task 33): the bytes were fetched by the authenticated
         client and this bridge receives a bare file name, so an export never needs a URL in the WebView either. -->
    <script src="file-output.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
